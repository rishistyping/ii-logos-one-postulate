name: Notebook CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  sympy-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert nbformat ipykernel sympy

      - name: Execute SymPy notebook
        run: |
          python -m nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=600 \
            --output /tmp/one_postulate_sympy_colab.executed.ipynb \
            one_postulate_sympy_colab.ipynb

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Why the Killing form matters</title>
  <desc id="desc">A flow diagram showing that the proof computes the algebraic invariant first and reads geometry from it afterward.</desc>
  <rect width="960" height="360" fill="#f6f2e8"/>
  <text x="56" y="52" fill="#1f2933" font-family="Palatino, Georgia, serif" font-size="28" font-weight="700">Why the Killing form matters</text>
  <text x="56" y="82" fill="#52606d" font-family="Palatino, Georgia, serif" font-size="15">The repository computes the algebra's canonical invariant and only then reads off the branch geometry.</text>

  <rect x="56" y="116" rx="18" ry="18" width="180" height="120" fill="#e8f1f8" stroke="#0f4c81" stroke-width="2"/>
  <text x="76" y="148" fill="#102a43" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">1. Start with</text>
  <text x="76" y="176" fill="#102a43" font-family="Palatino, Georgia, serif" font-size="18">relativity principle</text>
  <text x="76" y="202" fill="#102a43" font-family="Palatino, Georgia, serif" font-size="18">and isotropic</text>
  <text x="76" y="228" fill="#102a43" font-family="Palatino, Georgia, serif" font-size="18">kinematics</text>

  <rect x="282" y="116" rx="18" ry="18" width="192" height="120" fill="#fff2db" stroke="#b66a15" stroke-width="2"/>
  <text x="302" y="148" fill="#7c3e10" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">2. Prove the</text>
  <text x="302" y="176" fill="#7c3e10" font-family="Palatino, Georgia, serif" font-size="18">bracket family</text>
  <text x="302" y="204" fill="#7c3e10" font-family="Palatino, Georgia, serif" font-size="16">[K_i, K_j] = -kappa</text>
  <text x="302" y="226" fill="#7c3e10" font-family="Palatino, Georgia, serif" font-size="16">eps_ijk J_k</text>

  <rect x="520" y="102" rx="18" ry="18" width="220" height="148" fill="#e7f7ee" stroke="#0b6e4f" stroke-width="2"/>
  <text x="540" y="136" fill="#014d40" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">3. Compute the</text>
  <text x="540" y="164" fill="#014d40" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">canonical invariant</text>
  <text x="540" y="196" fill="#014d40" font-family="Palatino, Georgia, serif" font-size="18">adjoint action + trace</text>
  <text x="540" y="226" fill="#014d40" font-family="Palatino, Georgia, serif" font-size="20">B = diag(-4 I3, 4 kappa I3)</text>

  <rect x="786" y="102" rx="18" ry="18" width="126" height="148" fill="#f7e9e9" stroke="#9f1d1d" stroke-width="2"/>
  <text x="806" y="136" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">4. Read</text>
  <text x="806" y="164" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="20" font-weight="700">geometry</text>
  <text x="806" y="194" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="16">kappa &lt; 0</text>
  <text x="806" y="214" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="16">Euclidean</text>
  <text x="806" y="236" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="16">kappa = 0 Galilean</text>
  <text x="806" y="258" fill="#7b1f1f" font-family="Palatino, Georgia, serif" font-size="16">kappa &gt; 0 Lorentzian</text>

  <path d="M236 176 L270 176" fill="none" stroke="#52606d" stroke-width="3"/>
  <polygon points="270,176 258,170 258,182" fill="#52606d"/>
  <path d="M474 176 L508 176" fill="none" stroke="#52606d" stroke-width="3"/>
  <polygon points="508,176 496,170 496,182" fill="#52606d"/>
  <path d="M740 176 L774 176" fill="none" stroke="#52606d" stroke-width="3"/>
  <polygon points="774,176 762,170 762,182" fill="#52606d"/>

  <rect x="520" y="274" rx="14" ry="14" width="220" height="44" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5"/>
  <text x="540" y="302" fill="#014d40" font-family="Palatino, Georgia, serif" font-size="17">Metric consequences are recovered here, not assumed first.</text>

  <text x="56" y="320" fill="#7b8794" font-family="Palatino, Georgia, serif" font-size="14">Lean anchors: kinematic_bracket_table -> killing_form_diag -> killing_restricts_to_metric / spacetime_metric_invariant -> phase1_selection_summary</text>
</svg>

name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject placeholders in OnePostulate
        run: |
          if grep -RInE 'sorry|admit' OnePostulate --include='*.lean'; then
            echo "Found sorry/admit in OnePostulate/*.lean"
            exit 1
          fi

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Check deferred classification module
        run: lake env lean OnePostulate/ClassificationDerivation.lean
